version: "3.9"

services:
  db:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=bookaneer
      - POSTGRES_PASSWORD=***REMOVED***
      - POSTGRES_DB=BookingDb
    ports:
      - '5432:5432'
    volumes: 
      - db:/var/lib/postgresql/data
  api:
    image: jpreg.azurecr.io/booking-api:241102
    ports:
      - "8080:8080"
      - "8443:443"
    depends_on:
      - db
    environment:
      - SIGNING_KEY=***REMOVED***
      - JPECMAN_PASSWORD=***REMOVED***
volumes:
  db:
    driver: local