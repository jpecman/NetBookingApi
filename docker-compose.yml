version: "3.9"

services:
  db:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
  api:
    image: jpreg.azurecr.io/booking-api:241102
    ports:
      - "8080:8080"
      - "8443:443"
    depends_on:
      - db
    environment:
      - SIGNING_KEY=${SIGNING_KEY}
      - JPECMAN_PASSWORD=${JPECMAN_PASSWORD}
      - API_KEY=${API_KEY}
      - CONNECTION_STRING=${CONNECTION_STRING}
volumes:
  db:
    driver: local
